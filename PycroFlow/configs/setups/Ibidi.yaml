# Real-hardware template: Hamilton syringe pumps + ibidi MultiFlOW multiplexer.
#
# Copy this file to configs/setups/<YourSetup>.yaml and edit the values marked
# "EDIT" for your rig. Reservoirs are multiplexed by the ibidi MultiFlOW
# 24-channel actuator unit instead of Hamilton MVP rotary valves; the syringe
# pumps stay Hamilton.
#
# Sections are grouped by ROLE, and each names its driver: `fluid.pumps`,
# `fluid.multiplexer`, `imaging`, `illumination`.
#
# Before a run:
#   * Set `illumination.config` to the monet CONFIGS key of the MICROSCOPE this
#     runs on — that is the microscope's name, not this setup's name (this file
#     ships configured for the Mercury microscope).
#   * Set `fluid.pumps.interface.COM` to the pumps' serial port and
#     `fluid.multiplexer.port` to the COM port the MultiFlOW enumerates as
#     (a *separate* USB serial connection).
#   * Confirm the pump addresses/syringes and the reservoir<->channel wiring.

setup: Ibidi          # this setup's own name (shown in the setup selector)
emulated: false

fluid:
  system_type: legacy
  pumps:
    driver: hamilton-psd
    interface:
      COM: '3'        # EDIT: serial port of the Hamilton pump bus
      baud: 9600
    pump_a:
      address: 1
      instrument_type: '4'
      valve_type: Y
      syringe: 500u
      input_pos: in
      output_pos: out
      motorsteps_per_step: 1
      speed_factor: 2
    pump_out:
      address: 0
      instrument_type: '4'
      valve_type: Y
      syringe: 5.0m
      input_pos: in
      output_pos: out
      motorsteps_per_step: 1
      speed_factor: 2
  # Reservoir selection: ibidi MultiFlOW 24-channel actuator unit, on its own
  # USB serial port. No Hamilton MVP rotary valves in this setup.
  multiplexer:
    driver: ibidi-multiflow
    port: '7'         # EDIT: COM port of the MultiFlOW device
    baud: 115200      # device runs 115200 8N1; only ';' terminates a command
    channels: 24
    address: ibidi    # key referenced by each reservoir's valve_pos
  flush_pos:
    inject: in
    flush: out
  # Each reservoir maps to ibidi channel(s) (1..24). Selecting a reservoir
  # opens exactly those and closes all others; the pump (address 1) is set to
  # its input position. Trim this list to the channels you actually use.
  #
  # Unlike a Hamilton rotary valve (one position at a time), these valves are
  # independent, so a reservoir reached through several channels at once lists
  # them:  - {id: 3, valve_pos: {ibidi: [1, 3], 1: in}}
  reservoirs:
    - {id: 2,  valve_pos: {ibidi: [1, 2],  1: in}}
    - {id: 3,  valve_pos: {ibidi: [1, 3],  1: in}}
    - {id: 4,  valve_pos: {ibidi: [1, 4],  1: in}}
    - {id: 5,  valve_pos: {ibidi: [1, 5],  1: in}}
    - {id: 8,  valve_pos: {ibidi: [1, 6, 7, 8],  1: in}}
    - {id: 9,  valve_pos: {ibidi: [1, 6, 7, 9],  1: in}}
    - {id: 10, valve_pos: {ibidi: [1, 6, 7, 10], 1: in}}
    - {id: 11, valve_pos: {ibidi: [1, 6, 7, 11], 1: in}}
    - {id: 14, valve_pos: {ibidi: [1, 6, 7, 12, 13, 14], 1: in}}
    - {id: 15, valve_pos: {ibidi: [1, 6, 7, 12, 13, 15], 1: in}}
    - {id: 16, valve_pos: {ibidi: [1, 6, 7, 12, 13, 16], 1: in}}
    - {id: 17, valve_pos: {ibidi: [1, 6, 7, 12, 13, 17], 1: in}}
    - {id: 20, valve_pos: {ibidi: [1, 6, 7, 12, 13, 18, 19, 20], 1: in}}
    - {id: 21, valve_pos: {ibidi: [1, 6, 7, 12, 13, 18, 19, 21], 1: in}}
    - {id: 22, valve_pos: {ibidi: [1, 6, 7, 12, 13, 18, 19, 22], 1: in}}
    - {id: 23, valve_pos: {ibidi: [1, 6, 7, 12, 13, 18, 19, 23], 1: in}}
    - {id: 24, valve_pos: {ibidi: [1, 6, 7, 12, 13, 18, 19, 24], 1: in}}
  # Tubing volumes (ul) — EDIT to your measured values (run a tubing
  # calibration). With the multiplexer each reservoir connects directly to
  # pump_a: one segment per reservoir plus the pump->sample / pump->waste legs.
  tubing:
    - {from: R1,  to: pump_a, volume: 325}
    - {from: R2,  to: pump_a, volume: 325}
    - {from: R3,  to: pump_a, volume: 325}
    - {from: R4,  to: pump_a, volume: 325}
    - {from: R5,  to: pump_a, volume: 325}
    - {from: R6,  to: pump_a, volume: 325}
    - {from: R7,  to: pump_a, volume: 325}
    - {from: R8,  to: pump_a, volume: 325}
    - {from: R9,  to: pump_a, volume: 325}
    - {from: R10, to: pump_a, volume: 325}
    - {from: R11, to: pump_a, volume: 325}
    - {from: R12, to: pump_a, volume: 325}
    - {from: R13, to: pump_a, volume: 325}
    - {from: R14, to: pump_a, volume: 325}
    - {from: R15, to: pump_a, volume: 325}
    - {from: R16, to: pump_a, volume: 325}
    - {from: R17, to: pump_a, volume: 325}
    - {from: R18, to: pump_a, volume: 325}
    - {from: R19, to: pump_a, volume: 325}
    - {from: R20, to: pump_a, volume: 325}
    - {from: R21, to: pump_a, volume: 325}
    - {from: R22, to: pump_a, volume: 325}
    - {from: R23, to: pump_a, volume: 325}
    - {from: R24, to: pump_a, volume: 325}
    - {from: pump_a, to: sample, volume: 325}
    - {from: pump_a, to: flush_waste, volume: 650}

imaging:
  pfs_pars:
    tag_pfs: TIPFSOffset
    tag_zdrive: TIZDrive
    tag_status: TIPFSStatus
    prop_state: State
    prop_status: Status
    deltat: 10

illumination:
  backend: monet
  # EDIT: the monet CONFIGS key of the MICROSCOPE this fluidics setup runs on
  # — not this setup's name. Ships pointing at the Mercury microscope.
  config: Mercury
