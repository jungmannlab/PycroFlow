# No-hardware "IbidiEmulator" setup: Hamilton syringe pumps + ibidi MultiFlOW.
#
# Demonstrates multiplexing reservoirs with the ibidi MultiFlOW 24-channel
# actuator unit instead of Hamilton MVP rotary valves. The syringe pumps stay
# Hamilton; only the reservoir selection moves to the ibidi multiplexer.
#
# `emulated: true` makes SystemService build the *real* drivers over fake
# serial wires (FakeHamiltonSerial for the pumps, FakeIbidiSerial for the
# multiplexer), so the whole app runs with no instruments attached.
#
# To make a real ibidi setup, copy this file (or Ibidi.yaml), set
# `emulated: false`, give `fluid.pumps.interface` the right COM/baud, set
# `fluid.multiplexer.port` to the COM port the MultiFlOW enumerates as, and
# point `illumination.config` at the microscope's monet config.

setup: IbidiEmulator
emulated: true

fluid:
  system_type: legacy
  pumps:
    driver: hamilton-psd
    interface:
      COM: '0'
      baud: 9600
    pump_a:
      address: 1
      instrument_type: '4'
      valve_type: Y
      syringe: 500u
      input_pos: in
      output_pos: out
      motorsteps_per_step: 1
      speed_factor: 2
    pump_out:
      address: 0
      instrument_type: '4'
      valve_type: Y
      syringe: 5.0m
      input_pos: in
      output_pos: out
      motorsteps_per_step: 1
      speed_factor: 2
  # Reservoir selection: ibidi MultiFlOW 24-channel actuator unit (its own USB
  # serial port). No Hamilton MVP rotary valves in this setup.
  multiplexer:
    driver: ibidi-multiflow
    port: '7'        # COM port (real device); ignored under emulation
    baud: 115200     # device runs 115200 8N1; only ';' terminates a command
    channels: 24
    address: ibidi   # key referenced by each reservoir's valve_pos
    # One valve at a time: the real unit cannot actuate many simultaneously
    # (SETBATCHVALVES leaves some unmoved). See Ibidi.yaml.
    batch_valves: false
    switch_delay: 0.01   # s between consecutive single-valve commands
  flush_pos:
    inject: in
    flush: out
  # Each reservoir maps to ibidi channel(s) (1..24). Selecting a reservoir
  # opens exactly those and closes all others; the pump (address 1) is set to
  # its input position. 24 channels => reservoir ids 1..24.
  #
  # These valves are independent (unlike a Hamilton rotary valve), so a
  # reservoir fed through several channels at once lists them:
  #   - {id: 3, valve_pos: {ibidi: [1, 3], 1: in}}
  reservoirs:
    - {id: 1,  valve_pos: {ibidi: 1,  1: in}}
    - {id: 2,  valve_pos: {ibidi: 2,  1: in}}
    - {id: 3,  valve_pos: {ibidi: 3,  1: in}}
    - {id: 4,  valve_pos: {ibidi: 4,  1: in}}
    - {id: 5,  valve_pos: {ibidi: 5,  1: in}}
    - {id: 6,  valve_pos: {ibidi: 6,  1: in}}
    - {id: 7,  valve_pos: {ibidi: 7,  1: in}}
    - {id: 8,  valve_pos: {ibidi: 8,  1: in}}
    - {id: 9,  valve_pos: {ibidi: 9,  1: in}}
    - {id: 10, valve_pos: {ibidi: 10, 1: in}}
    - {id: 11, valve_pos: {ibidi: 11, 1: in}}
    - {id: 12, valve_pos: {ibidi: 12, 1: in}}
    - {id: 13, valve_pos: {ibidi: 13, 1: in}}
    - {id: 14, valve_pos: {ibidi: 14, 1: in}}
    - {id: 15, valve_pos: {ibidi: 15, 1: in}}
    - {id: 16, valve_pos: {ibidi: 16, 1: in}}
    - {id: 17, valve_pos: {ibidi: 17, 1: in}}
    - {id: 18, valve_pos: {ibidi: 18, 1: in}}
    - {id: 19, valve_pos: {ibidi: 19, 1: in}}
    - {id: 20, valve_pos: {ibidi: 20, 1: in}}
    - {id: 21, valve_pos: {ibidi: 21, 1: in}}
    - {id: 22, valve_pos: {ibidi: 22, 1: in}}
    - {id: 23, valve_pos: {ibidi: 23, 1: in}}
    - {id: 24, valve_pos: {ibidi: 24, 1: in}}
  # Tubing volumes (ul). With the multiplexer each reservoir connects directly
  # to pump_a: one segment per reservoir plus the pump->sample / pump->waste
  # legs.
  tubing:
    - {from: R1,  to: pump_a, volume: 325}
    - {from: R2,  to: pump_a, volume: 325}
    - {from: R3,  to: pump_a, volume: 325}
    - {from: R4,  to: pump_a, volume: 325}
    - {from: R5,  to: pump_a, volume: 325}
    - {from: R6,  to: pump_a, volume: 325}
    - {from: R7,  to: pump_a, volume: 325}
    - {from: R8,  to: pump_a, volume: 325}
    - {from: R9,  to: pump_a, volume: 325}
    - {from: R10, to: pump_a, volume: 325}
    - {from: R11, to: pump_a, volume: 325}
    - {from: R12, to: pump_a, volume: 325}
    - {from: R13, to: pump_a, volume: 325}
    - {from: R14, to: pump_a, volume: 325}
    - {from: R15, to: pump_a, volume: 325}
    - {from: R16, to: pump_a, volume: 325}
    - {from: R17, to: pump_a, volume: 325}
    - {from: R18, to: pump_a, volume: 325}
    - {from: R19, to: pump_a, volume: 325}
    - {from: R20, to: pump_a, volume: 325}
    - {from: R21, to: pump_a, volume: 325}
    - {from: R22, to: pump_a, volume: 325}
    - {from: R23, to: pump_a, volume: 325}
    - {from: R24, to: pump_a, volume: 325}
    - {from: pump_a, to: sample, volume: 325}
    - {from: pump_a, to: flush_waste, volume: 650}

imaging:
  pfs_pars:
    tag_pfs: TIPFSOffset
    tag_zdrive: TIZDrive
    tag_status: TIPFSStatus
    prop_state: State
    prop_status: Status
    deltat: 10

illumination:
  backend: monet
  config: IbidiEmulator
