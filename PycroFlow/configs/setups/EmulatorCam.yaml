# No-hardware "EmulatorCam" setup: the Emulator rig + a fluidics monitoring
# webcam config (WP-FLUIDICS-CAM). `emulated: true` makes SystemService build
# the real drivers over the fake serial AND makes the monitoring subsystem use
# the synthetic (--emulator) frame source, so the whole app + per-round clip
# recording runs end to end with no instruments and no camera library.
#
# Fluid / imaging / illumination wiring mirrors Emulator.yaml verbatim (it also
# reuses the `Emulator` monet config); the only addition is the `monitoring:`
# block at the end. Kept as a separate setup so the plain `Emulator` runs
# unchanged (no capture process) -- select `EmulatorCam` to exercise recording.

setup: EmulatorCam
emulated: true

fluid:
  system_type: legacy
  pumps:
    driver: hamilton-psd
    interface:
      COM: '0'
      baud: 9600
    pump_a:
      address: 1
      instrument_type: '4'
      valve_type: Y
      syringe: 500u
      input_pos: in
      output_pos: out
      motorsteps_per_step: 1
      speed_factor: 2
    pump_out:
      address: 0
      instrument_type: '4'
      valve_type: Y
      syringe: 5.0m
      input_pos: in
      output_pos: out
      motorsteps_per_step: 1
      speed_factor: 2
  multiplexer:
    driver: hamilton-mvp
    valves:
      - {address: 3, instrument_type: MVP, valve_type: 8-5}
      - {address: 5, instrument_type: MVP, valve_type: 8-5}
  flush_pos:
    inject: in
    flush: out
  reservoirs:
    - {id: 1, valve_pos: {3: 2, 1: in}}
    - {id: 2, valve_pos: {3: 3, 1: in}}
    - {id: 3, valve_pos: {3: 4, 1: in}}
    - {id: 4, valve_pos: {3: 5, 1: in}}
    - {id: 5, valve_pos: {3: 6, 1: in}}
    - {id: 6, valve_pos: {3: 7, 1: in}}
    - {id: 7, valve_pos: {3: 8, 1: in}}
    - {id: 14, valve_pos: {3: 1, 5: 1, 1: in}}
    - {id: 15, valve_pos: {3: 1, 5: 2, 1: in}}
    - {id: 16, valve_pos: {3: 1, 5: 3, 1: in}}
    - {id: 17, valve_pos: {3: 1, 5: 4, 1: in}}
    - {id: 18, valve_pos: {3: 1, 5: 5, 1: in}}
    - {id: 19, valve_pos: {3: 1, 5: 6, 1: in}}
    - {id: 20, valve_pos: {3: 1, 5: 7, 1: in}}
    - {id: 21, valve_pos: {3: 1, 5: 8, 1: in}}
  tubing:
    - {from: R21, to: V5, volume: 325}
    - {from: R20, to: V5, volume: 325}
    - {from: R19, to: V5, volume: 325}
    - {from: R18, to: V5, volume: 325}
    - {from: R17, to: V5, volume: 325}
    - {from: R16, to: V5, volume: 325}
    - {from: R15, to: V5, volume: 325}
    - {from: R14, to: V5, volume: 325}
    - {from: V5, to: V3, volume: 195}
    - {from: R7, to: V3, volume: 325}
    - {from: R6, to: V3, volume: 325}
    - {from: R5, to: V3, volume: 325}
    - {from: R4, to: V3, volume: 325}
    - {from: R3, to: V3, volume: 325}
    - {from: R2, to: V3, volume: 325}
    - {from: R1, to: V3, volume: 325}
    - {from: R0, to: V3, volume: 325}
    - {from: V3, to: pump_a, volume: 195}
    - {from: pump_a, to: sample, volume: 325}
    - {from: pump_a, to: flush_waste, volume: 650}

imaging:
  pfs_pars:
    tag_pfs: TIPFSOffset
    tag_zdrive: TIZDrive
    tag_status: TIPFSStatus
    prop_state: State
    prop_status: Status
    deltat: 10

illumination:
  backend: monet
  config: Emulator

# Fluidics monitoring webcams (WP-FLUIDICS-CAM, Phase 1).
# Optional block: omit it (or the `cameras` list) and the subsystem is inert.
# `output_dir` is the pool/archive the per-round clips land in; here it points
# at a scratch dir so the emulated app writes somewhere harmless.
monitoring:
  output_dir: ./fluidics_cam
  fps: 5
  retention_days: 14
  # source: emulator   # inferred from `emulated: true`; set explicitly on a rig
  cameras:
    - {role: reservoir, device: 0, width: 320, height: 240}
    - {role: pump,      device: 1, width: 320, height: 240}
    - {role: sample,    device: 2, width: 320, height: 240}
