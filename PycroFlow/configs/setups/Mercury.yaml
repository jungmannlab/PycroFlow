# Per-microscope hardware (setup) config for the "Mercury" microscope.
#
# Holds only the bits that are fixed for every run on this microscope, grouped
# by ROLE (not by vendor): `fluid` (pumps, reservoir multiplexer, reservoir
# manifold, tubing), `imaging` (PFS tags) and `illumination` (the monet config
# naming this microscope's lasers). Each role names the driver serving it.
#
# The experiment design supplies which reservoirs are used (reservoir_names),
# special_names and cleaning_reservoirs; configs.assemble_hamilton_config()
# merges the two at connect time.

setup: Mercury
emulated: false

fluid:
  system_type: legacy
  pumps:
    driver: hamilton-psd
    interface:
      COM: '3'
      baud: 9600
    pump_a:
      address: 1
      instrument_type: '4'
      valve_type: Y
      syringe: 500u
      input_pos: in
      output_pos: out
      motorsteps_per_step: 1
      speed_factor: 2
    pump_out:
      address: 0
      instrument_type: '4'
      valve_type: Y
      syringe: 5.0m
      input_pos: in
      output_pos: out
      motorsteps_per_step: 1
      speed_factor: 2
  # Reservoir selection: two chained Hamilton MVP rotary valves.
  multiplexer:
    driver: hamilton-mvp
    valves:
      - {address: 3, instrument_type: MVP, valve_type: 8-5}
      - {address: 5, instrument_type: MVP, valve_type: 8-5}
  flush_pos:
    inject: in
    flush: out
  # Full candidate wiring of every manifold position. The experiment selects
  # the subset it uses; unused positions are dropped at assemble time.
  reservoirs:
    - {id: 1, valve_pos: {3: 2, 1: in}}
    - {id: 2, valve_pos: {3: 3, 1: in}}
    - {id: 3, valve_pos: {3: 4, 1: in}}
    - {id: 4, valve_pos: {3: 5, 1: in}}
    - {id: 5, valve_pos: {3: 6, 1: in}}
    - {id: 6, valve_pos: {3: 7, 1: in}}
    - {id: 7, valve_pos: {3: 8, 1: in}}
    - {id: 14, valve_pos: {3: 1, 5: 1, 1: in}}
    - {id: 15, valve_pos: {3: 1, 5: 2, 1: in}}
    - {id: 16, valve_pos: {3: 1, 5: 3, 1: in}}
    - {id: 17, valve_pos: {3: 1, 5: 4, 1: in}}
    - {id: 18, valve_pos: {3: 1, 5: 5, 1: in}}
    - {id: 19, valve_pos: {3: 1, 5: 6, 1: in}}
    - {id: 20, valve_pos: {3: 1, 5: 7, 1: in}}
    - {id: 21, valve_pos: {3: 1, 5: 8, 1: in}}
  # Tubing volumes (ul) between physical points. Records round-trip to a
  # tuple-keyed dict: {('R21','V5'): 325, ...}.
  tubing:
    - {from: R21, to: V5, volume: 325}
    - {from: R20, to: V5, volume: 325}
    - {from: R19, to: V5, volume: 325}
    - {from: R18, to: V5, volume: 325}
    - {from: R17, to: V5, volume: 325}
    - {from: R16, to: V5, volume: 325}
    - {from: R15, to: V5, volume: 325}
    - {from: R14, to: V5, volume: 325}
    - {from: V5, to: V3, volume: 195}
    - {from: R7, to: V3, volume: 325}
    - {from: R6, to: V3, volume: 325}
    - {from: R5, to: V3, volume: 325}
    - {from: R4, to: V3, volume: 325}
    - {from: R3, to: V3, volume: 325}
    - {from: R2, to: V3, volume: 325}
    - {from: R1, to: V3, volume: 325}
    - {from: R0, to: V3, volume: 325}
    - {from: V3, to: pump_a, volume: 195}
    - {from: pump_a, to: sample, volume: 325}
    - {from: pump_a, to: flush_waste, volume: 650}

imaging:
  # --- live analysis / MM preview (WP-LIVE-INT) -----------------------------
  # Uncomment and fill with THIS camera's picasso photon-conversion values
  # (datasheet / the Gate-2 harness flags used on this rig). Without the
  # camera_info block, live localization and the Live tab's MM preview stay
  # disabled (logged at startup + a dialog on the preview toggle).
  # camera_info:
  #   Baseline: 100.0       # camera offset (ADU)
  #   Sensitivity: 0.46     # e-/ADU conversion
  #   Gain: 1               # EM gain (1 for sCMOS)
  #   Qe: 0.82              # quantum efficiency at the imaging wavelength
  #   Pixelsize: 130        # sample-plane pixel size (nm)
  # live_analysis:          # optional tuning (defaults in services/live_run.py)
  #   localize_params: {Box Size: 7, Min. Net Gradient: 5000}
  #   max_pending_frames: 256
  #   # archive_dir: '//server/share/archive/raw'  # enables the C15 move
  pfs_pars:
    tag_pfs: TIPFSOffset
    tag_zdrive: TIZDrive
    tag_status: TIPFSStatus
    prop_state: State
    prop_status: Status
    deltat: 10

illumination:
  backend: monet
  # The monet CONFIGS key for THIS microscope's lasers (drives the Monet tab
  # and the experiment design's laser dropdown).
  config: Mercury
