name: Unit Tests (hosted)

# Hardware-independent unit tests on a cheap GitHub-hosted runner
# (ubuntu-latest), across a Python version matrix (like the sibling monet /
# picasso-registry repos). The REQUIRED status check that gates merges into
# develop/master is the aggregator job below, named "Unit Tests (hosted)" — it
# passes only if every matrix leg passes. Keeping that name stable means adding
# or dropping a Python version needs NO change to the branch-protection ruleset
# (which pins the context "Unit Tests (hosted)").
#
# The deep Windows tier ("Python Unit Tests (Windows)", run-unittests-windows.yml)
# needs the lab box with real instruments + USB drivers and is unavailable on
# forks — so it must NOT be a required check.
#
# The suite runs with no vendor SDKs: tests/__init__.py + the top-level
# conftest.py install sys.modules mocks for pycromanager / monet / pycobolt /
# nidaqmx, so no hardware, data, or network is needed.
#
# Headless setup:
#   * base `pip install -e .` is wheel-only (pyserial / loguru / pyyaml /
#     pydantic); the heavy instrument stack lives in the [hardware] extra and is
#     intentionally NOT installed. The [dev] extra adds pytest; [gui] adds PyQt6
#     (also a wheel) so the Stage 5 GUI unit tests actually run.
#   * the Qt runtime libs + QT_QPA_PLATFORM=offscreen let the GUI unit tests
#     import PyQt6 without a display (the package is import-safe without PyQt6;
#     Qt is imported lazily).

on:
  push:
    branches:
      - master
      - develop
      # WP-FLUIDICS-CAM builds on this lab-directed integration base; run the
      # gate here too so PRs into it are covered (see the work-order brief).
      - feature/ibidimultiplexer
  pull_request:
    branches:
      - master
      - develop
      - feature/ibidimultiplexer

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # Report every leg's result even if one fails (don't cancel the others).
      fail-fast: false
      matrix:
        # Python 3.11 is the floor (requires-python>=3.11). 3.12 mirrors the
        # picasso-registry matrix. Add 3.13/3.14 once picassosr + PyQt6 wheels
        # for them are confirmed (monet, with lighter deps, already runs them).
        python-version: ["3.11", "3.12"]
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Qt runtime libraries (headless PyQt6 import)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Install package with dev + gui extras
        # Intentionally NOT installing [hardware] — the conftest.py mocks
        # pycromanager / monet / pycobolt / nidaqmx so CI runs without any
        # vendor SDKs or USB drivers. [dev] adds pytest; [gui] adds PyQt6.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,gui]"

      # The Qt GUI tests run in their OWN interpreter. Under one-process
      # `unittest discover` the native worker threads the live-analysis process
      # backend leaks (spawn Processes + loguru's enqueue writer) outlive their
      # tests, and a leftover native thread beside PyQt6's offscreen event loop
      # SIGSEGVs the whole run on the hosted runner. Splitting keeps the Qt
      # tests covered without that cross-module thread collision.
      - name: Run unit tests (Qt GUI isolated out)
        env:
          PYCROFLOW_ISOLATE_GUI_TESTS: "1"
        run: python -m unittest discover -v

      - name: Run Qt GUI tests in a dedicated process
        run: >
          python -m unittest -v
          PycroFlow.tests.test_stage5_gui
          PycroFlow.tests.test_live_gui

  unit-tests-hosted:
    # The stable REQUIRED status check (branch-protection ruleset pins the
    # context "Unit Tests (hosted)"). Green only if every matrix leg passed —
    # `if: always()` so it reports pass/fail rather than being skipped when a
    # leg fails, and so the required check never sits forever "expected".
    name: Unit Tests (hosted)
    needs: tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all Python matrix legs to pass
        run: |
          result='${{ needs.tests.result }}'
          echo "unit-test matrix result: $result"
          if [ "$result" != "success" ]; then
            echo "::error::one or more Python legs did not pass ($result)"
            exit 1
          fi
          echo "All Python matrix legs passed."
